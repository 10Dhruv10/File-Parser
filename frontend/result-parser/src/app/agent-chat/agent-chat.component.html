<div class="example-container">
  <mat-form-field hintLabel="Max 50 characters">
    <mat-label>Enter some input</mat-label>
    <input matInput #input maxlength="50" placeholder="Type your query here" (input)="onInput($event)" />
    <mat-hint align="end">{{value().length}}/10</mat-hint>

    <button mat-button (click)="sendMessage()">    
       Send 
       <mat-icon iconPositionEnd>arrow_forward</mat-icon>
    </button>
  </mat-form-field>
</div>
